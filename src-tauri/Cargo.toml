[package]
name = "erp-system"
version = "1.0.0"
description = "ERP System Desktop Application"
authors = ["ERP Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "erp_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "erp-system"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
